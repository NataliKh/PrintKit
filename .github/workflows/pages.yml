name: Deploy Листокия to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify generators
        run: node --test tests/*.test.mjs
      - name: Install browser test tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 pngjs@7.0.0 pixelmatch@5.3.0
          npx playwright install --with-deps chromium firefox
          sudo apt-get install -y poppler-utils
      - name: Retrieve last main visual snapshots
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/printkit-baseline
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=printkit-visual&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | sort_by(.created_at) | last | .id // empty' || true)
          if [[ -n "$artifact_id" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/printkit-baseline.zip
            unzip -q /tmp/printkit-baseline.zip -d artifacts/printkit-baseline
            echo "Using previous main snapshots: artifact $artifact_id"
          else
            echo "No previous main screenshots; this run will generate the first baseline."
          fi
      - name: Verify real A4 PDFs in Chromium
        env:
          PRINTKIT_VISUAL_BASELINE: artifacts/printkit-baseline
        run: node tests/print.browser.mjs
      - name: Verify independent Firefox A4 print layout
        run: node tests/firefox.browser.mjs
      - name: Keep Firefox and Chromium comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: printkit-firefox-print
          path: artifacts/firefox-print/
          retention-days: 30
          if-no-files-found: warn
      - name: Verify physical print check kit in Chromium and Firefox
        run: node tests/print-check.browser.mjs
      - name: Save editor screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: printkit-editor-ui
          path: artifacts/ui/
          retention-days: 30
          if-no-files-found: ignore
      - name: Render all 32 real A4 template previews
        run: node tests/build-previews.mjs
      - name: Check guides, image assets and deep links
        run: node tests/seo.browser.mjs
      - name: Save real template thumbnails
        uses: actions/upload-artifact@v4
        with:
          name: printkit-thumbnails
          path: previews/
          retention-days: 30
          if-no-files-found: error
      - name: Keep PDFs, page previews and visual diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: printkit-visual
          path: artifacts/printkit-visual/
          retention-days: 30
          if-no-files-found: warn
  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Retrieve verified A4 thumbnails
        uses: actions/download-artifact@v4
        with:
          name: printkit-thumbnails
          path: previews
      - name: Stage website without test dependencies or private artifacts
        run: |
          mkdir -p _site
          cp CNAME favicon.svg robots.txt index.html app.js math.js render.js presets.js saved-kits.js catalog.js analytics.js style.css seo.css analytics.css sitemap.xml legal.html privacy.html _site/
          cp -R tools _site/tools
          cp -R previews _site/previews
          grep -qx 'listokia.ru' _site/CNAME
          grep -qx 'Sitemap: https://listokia.ru/sitemap.xml' _site/robots.txt
          test -s _site/favicon.svg
          test -s _site/previews/manifest.json
          test -f _site/tools/math/index.html
          test -f _site/tools/print-check/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
